[package]
name = "fili-photocraft"
version = "0.0.1"
edition = "2024"
description = "fili-photocraft: the image editor of Filigrane, a Qt Quick window (Fili.UI) on the PhotoCraft engine"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
fili-ui = { git = "https://github.com/filigrane-os/fili-ui", tag = "v0.3.0" }
libc = "0.2.191"
serde_json = "1"
# The PhotoCraft engine (MIT OR Apache-2.0), without its egui interface. All four stay on one upstream commit.
photocraft-engine = { git = "https://github.com/storytold/photocraft", rev = "9ee918fb9d17d35185f1e606c7ef532e548f54c1" }
photocraft-io = { git = "https://github.com/storytold/photocraft", rev = "9ee918fb9d17d35185f1e606c7ef532e548f54c1" }
photocraft-compose = { git = "https://github.com/storytold/photocraft", rev = "9ee918fb9d17d35185f1e606c7ef532e548f54c1" }
photocraft-raster = { git = "https://github.com/storytold/photocraft", rev = "9ee918fb9d17d35185f1e606c7ef532e548f54c1" }

[build-dependencies]
cxx-qt-build = "0.10.0"

# Same settings as upstream: the pixel code needs full optimisation
[profile.release]
lto = "thin"
codegen-units = 16
strip = true

# PhotoCraft's own forks of these crates; a [patch] does not travel with a git dependency
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
linesweeper = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
vello_common = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
vello_cpu = { git = "https://github.com/storytold/craft-libs", rev = "8d436f486a2e890930ffdf10b602935feb492c97" }
