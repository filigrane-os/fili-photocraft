<?xml version="1.0" encoding="UTF-8"?>
<!-- fili-photocraft, an image with its layers in the Filigrane colours: night tile, two slate layers behind a veil picture with a sand sun -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>PhotoCraft</title>
  <!-- tile -->
  <rect x="6" y="6" width="84" height="84" rx="14" fill="#232b36" stroke="#3c4858" stroke-width="2"/>
  <!-- the layers behind -->
  <rect x="24" y="14" width="52" height="38" rx="5" fill="#2d3846" stroke="#3c4858" stroke-width="1.5"/>
  <rect x="19" y="21" width="52" height="38" rx="5" fill="#3c4858" stroke="#5f7894" stroke-width="1.5"/>
  <!-- the picture in front -->
  <rect x="14" y="29" width="52" height="40" rx="5" fill="#9dbbd6" stroke="#3c4858" stroke-width="1.5"/>
  <circle cx="50" cy="42" r="6" fill="#d2bf92"/>
  <path d="M14 62l15-14 11 10 8-7 18 17v1a5 5 0 0 1-5 5H19a5 5 0 0 1-5-5z" fill="#5f7894"/>
  <!-- the adjustment: a slider -->
  <path d="M20 80h56" stroke="#5f7894" stroke-width="3" stroke-linecap="round"/>
  <circle cx="58" cy="80" r="5" fill="#d2bf92" stroke="#3c4858" stroke-width="1.5"/>
</svg>
